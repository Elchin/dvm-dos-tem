# RTS (retrogressive thaw slump) unit + regression tests.
# Complements checkout_build_run.yml (Docker build + demo run on PRs to
# master): this workflow builds natively on Ubuntu and runs `make rts-test`
# (C++ unit tests + pytest regression on the 1-cell synthetic case in
# testing-data/rts-synthetic) on every push and pull request. Includes the
# monthly->daily (m2d) unit tests and the flag-off legacy regression
# (tests/rts/reference/legacy_m2d).
name: RTS tests

# Run only on RTS branches (e.g. rts-light-cbal, wetland/rts-merge) and on
# demand. On other branches (feat/hg-*, fix/*, prod/*) the RTS suite is not
# maintained (no rts-test Makefile target, tests/rts out of sync), so running it
# on every push only produced failure notifications.
on:
  push:
    branches: [ "rts-**", "**/rts-**" ]
  pull_request:
    branches: [ "rts-**", "**/rts-**" ]
  workflow_dispatch:

jobs:
  rts-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Makefile uses `git describe` for GIT_SHA

      - name: Fetch external Reburn modules (Fireweed, Burnup)
        # Untracked dirs (.gitignore); WildFire.h needs FireweedFuelModels.h.
        run: bash scripts/get_external.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libnetcdf-dev libboost-all-dev libjsoncpp-dev \
            liblapacke-dev libreadline-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install numpy netCDF4 pytest

      - name: Build dvmdostem
        run: make -j"$(nproc)" SITE_SPECIFIC_INCLUDES="-I/usr/include/jsoncpp"

      - name: Run RTS unit + regression tests
        env:
          # References were generated with g++ 14 / Debian 13; allow small
          # floating-point drift from a different compiler/libm.
          RTS_RTOL: '1e-5'
          RTS_ATOL: '1e-6'
        run: make rts-test SITE_SPECIFIC_INCLUDES="-I/usr/include/jsoncpp" RTS_PYTHON=python
